services:
  db:
    image: postgres:16-alpine
    container_name: blog_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: blog_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - blog_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog_app -d blog"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: blog_api
    restart: unless-stopped
    environment:
      PORT: 8787
      ALLOWED_ORIGIN: https://blog.michikatsu.top
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET}
      POSTGRES_URL: postgresql://blog_app:${POSTGRES_PASSWORD}@db:5432/blog
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - blog_uploads:/app/uploads
    networks: [internal, caddy]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: blog_web
    restart: unless-stopped
    environment:
      API_URL: http://blog_api:8787
    depends_on: [api]
    networks: [caddy]

networks:
  internal:
  caddy:
    external: true
    name: aurelia_default

volumes:
  blog_postgres_data:
  blog_uploads:
