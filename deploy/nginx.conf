server {
  listen 80;
  server_name _;
  client_max_body_size 20m;
  location /api/ { proxy_pass http://api:8787/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location / { proxy_pass http://web:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
}
