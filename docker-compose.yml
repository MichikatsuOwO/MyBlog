services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paperlane
      POSTGRES_USER: paperlane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-db-password}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    restart: unless-stopped
  api:
    build: ./apps/api
    env_file: .env
    restart: unless-stopped
    depends_on: [db]
    expose: ["8787"]
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:8787}
    depends_on: [api]
    restart: unless-stopped
    expose: ["3000"]
  nginx:
    image: nginx:1.27-alpine
    depends_on: [web, api]
    ports: ["80:80"]
    restart: unless-stopped
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  postgres_data:
